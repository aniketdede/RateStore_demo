services:
  - type: web
    name: ratestore-api
    runtime: node
    buildCommand: "npm install"
    startCommand: "npm run dev"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://ratestore-demo.vercel.app
    plan: free
  - type: static
    name: ratestore-client
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://ratestore-api.onrender.com
